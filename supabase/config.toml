project_id = "ns-online-shipment-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://ns-sales-system.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**", "https://ns-sales-system.vercel.app/**"]
enable_signup = false

[functions.get-public-shipment]
verify_jwt = false

[functions.manage-share-link]
verify_jwt = true

[functions.publish-shipment]
verify_jwt = true

[functions.invite-staff]
verify_jwt = true
